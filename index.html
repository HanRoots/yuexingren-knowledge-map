<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅星人学识地图</title>
    <link rel="stylesheet" href="./assets/yuexingren/yuexingren-theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-locked">
    <section class="auth-gate" id="authGate" aria-label="访问验证">
      <div class="auth-panel">
        <div class="auth-intro" aria-hidden="true">
          <img
            class="auth-intro__logo"
            src="./assets/yuexingren/yuexingren-logo.png"
            alt=""
          />
          <img
            class="auth-intro__illustration"
            src="./assets/yuexingren/reading-workspace-illustration.png"
            alt=""
          />
        </div>

        <form class="auth-card" id="passwordForm">
          <img
            class="auth-card__mark"
            src="./assets/yuexingren/yuexingren-logo-mark.png"
            alt="阅星人读书社"
          />
          <p class="auth-kicker">阅星人学识地图</p>
          <h2>访问验证</h2>
          <label class="auth-field" for="passwordInput">
            <span>访问密码</span>
            <input id="passwordInput" type="password" autocomplete="current-password" />
          </label>
          <p class="auth-error" id="passwordError" role="alert" hidden>密码不正确，请重新输入。</p>
          <button type="submit">进入学识地图</button>
        </form>
      </div>
    </section>

    <div class="page-shell" id="pageShell" aria-hidden="true">
      <header class="hero">
        <div class="hero__content">
          <div class="brand-lockup">
            <img src="./assets/yuexingren/yuexingren-logo-mark.png" alt="" />
            <div>
              <strong>阅星人读书社</strong>
            </div>
          </div>
          <h1>阅星人学识地图</h1>
          <div class="hero__stats" id="heroStats" aria-label="L1-L5 书目统计"></div>
        </div>
        <div class="hero__visual" aria-hidden="true">
          <img
            src="./assets/yuexingren/reading-workspace-illustration.png"
            alt=""
          />
        </div>
      </header>

      <section class="toolbar" aria-label="书目筛选">
        <div class="level-tabs" id="levelTabs" aria-label="级别筛选"></div>
        <label class="search-box" for="searchInput">
          <span class="search-box__icon" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="搜索书名 / 学识 / 类型关键词" autocomplete="off" />
        </label>
        <label class="select-box" for="knowledgeSelect">
          <span>学识</span>
          <select id="knowledgeSelect"></select>
        </label>
        <label class="select-box" for="typeSelect">
          <span>类型</span>
          <select id="typeSelect"></select>
        </label>
        <button class="edit-mode-button" id="editModeButton" type="button" aria-pressed="false">
          编辑内容
        </button>
        <a class="reset-button" id="resetButton" href="./index.html" role="button">重置</a>
      </section>

      <section class="edit-panel" id="editPanel" aria-label="本地编辑工具" hidden>
        <div>
          <strong>本地编辑模式</strong>
          <span>文字修改与书目增删仅保存在当前浏览器，可导出 JSON 文件备份。</span>
        </div>
        <div class="edit-panel__actions">
          <button id="addBookButton" type="button">新增书目</button>
          <button class="edit-panel__publish" id="publishEditsButton" type="button">发布到云端</button>
          <button id="exportEditsButton" type="button">导出修改</button>
          <button id="clearEditsButton" type="button">恢复线上内容</button>
        </div>
        <p class="edit-status" id="editStatus" aria-live="polite"></p>
      </section>

      <main class="layout">
        <aside class="book-rail" aria-label="学识书目目录">
          <div class="book-rail__top">
            <p>学识目录</p>
            <strong id="railCount">0 本</strong>
          </div>
          <nav class="book-nav" id="bookNav"></nav>
        </aside>

        <section class="content-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Curriculum Map</p>
              <h2>学识主题总览</h2>
            </div>
            <p id="resultSummary" class="result-summary"></p>
          </div>

          <div class="topic-board" id="topicBoard" aria-label="学识主题概览"></div>
          <div class="topic-cloud" id="topicCloud" aria-label="学识主题标签"></div>
          <div class="type-cloud" id="typeCloud" aria-label="书籍类型标签"></div>
          <div class="book-grid" id="bookGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <strong>没有匹配的书目</strong>
            <span>换一个关键词或学识主题试试。</span>
          </div>
        </section>
      </main>
    </div>

    <dialog class="publish-dialog" id="publishDialog">
      <form class="publish-form" id="publishForm">
        <div class="publish-form__heading">
          <div>
            <p>GitHub Pages</p>
            <h2>发布书目修改</h2>
          </div>
          <button class="publish-dialog__close" id="closePublishDialogButton" type="button" aria-label="关闭">
            ×
          </button>
        </div>
        <p class="publish-form__description">
          修改将提交到 HanRoots/yuexingren-knowledge-map 的 main 分支，并自动触发页面部署。
        </p>
        <label class="publish-field" for="githubTokenInput">
          <span>GitHub 细粒度令牌</span>
          <input
            id="githubTokenInput"
            type="password"
            autocomplete="off"
            required
            placeholder="github_pat_..."
          />
          <small>
            令牌仅用于本次发布，不会保存。权限只需 Contents: Read and write。
            <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer">
              创建细粒度令牌
            </a>
          </small>
        </label>
        <label class="publish-field" for="commitMessageInput">
          <span>更新说明</span>
          <input id="commitMessageInput" type="text" value="Update book content from page editor" required />
        </label>
        <p class="publish-error" id="publishError" role="alert" hidden></p>
        <div class="publish-form__actions">
          <button id="cancelPublishButton" type="button">取消</button>
          <button class="publish-submit" id="confirmPublishButton" type="submit">确认发布</button>
        </div>
      </form>
    </dialog>

    <dialog class="publish-dialog add-book-dialog" id="addBookDialog">
      <form class="publish-form add-book-form" id="addBookForm">
        <div class="publish-form__heading">
          <div>
            <p>Book Editor</p>
            <h2>新增书目</h2>
          </div>
          <button class="publish-dialog__close" id="closeAddBookDialogButton" type="button" aria-label="关闭">
            ×
          </button>
        </div>
        <div class="add-book-form__row">
          <label class="publish-field" for="addBookLevel">
            <span>级别</span>
            <select id="addBookLevel" name="level" required>
              <option value="L1">L1</option>
              <option value="L2">L2</option>
              <option value="L3">L3</option>
              <option value="L4">L4</option>
              <option value="L5">L5</option>
            </select>
          </label>
          <label class="publish-field" for="addBookPosition">
            <span>插入序号</span>
            <input id="addBookPosition" name="position" type="number" min="1" step="1" required />
          </label>
        </div>
        <label class="publish-field" for="addBookTitle">
          <span>书名</span>
          <input id="addBookTitle" name="title" type="text" required placeholder="《书名》" />
        </label>
        <label class="publish-field" for="addBookKnowledgeGoals">
          <span>学识目标</span>
          <textarea id="addBookKnowledgeGoals" name="knowledgeGoals" rows="7"></textarea>
        </label>
        <label class="publish-field" for="addBookValueGoals">
          <span>价值观</span>
          <textarea id="addBookValueGoals" name="valueGoals" rows="5"></textarea>
        </label>
        <label class="publish-field" for="addBookAbilityGoals">
          <span>能力目标</span>
          <textarea id="addBookAbilityGoals" name="abilityGoals" rows="4"></textarea>
        </label>
        <fieldset class="editor-types add-book-types">
          <legend class="editor-field__label">书籍类型</legend>
          <div class="editor-types__options" id="addBookTypeOptions"></div>
        </fieldset>
        <div class="publish-form__actions">
          <button id="cancelAddBookButton" type="button">取消</button>
          <button class="publish-submit" type="submit">保存新书</button>
        </div>
      </form>
    </dialog>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
